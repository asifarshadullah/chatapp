name: Deploy

# Started by hand only: "Run workflow" picks the branch to deploy. A push or a merge deploys nothing.
on:
  workflow_dispatch:

# A second deploy waits for the first instead of racing it.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/asifarshadullah/chatapp

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish image
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: APP_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Release
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.LIVE_URL }}

    steps:
      - name: Ask Render to run this commit's image
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE_URL: ${{ env.IMAGE }}:${{ github.sha }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::The production environment has no RENDER_DEPLOY_HOOK_URL secret."
            exit 1
          fi
          curl --fail --silent --show-error --get --data-urlencode "imgURL=$IMAGE_URL" "$DEPLOY_HOOK" > /dev/null

      - name: Wait until the live app runs this commit
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
          COMMIT: ${{ github.sha }}
        run: |
          if [ -z "$LIVE_URL" ]; then
            echo "::error::The LIVE_URL variable is not set."
            exit 1
          fi
          deadline=$((SECONDS + 600))
          until curl --silent --max-time 30 "${LIVE_URL%/}/healthz" | grep -q "\"commit\":\"$COMMIT\""; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::$LIVE_URL is not running $COMMIT after 10 minutes."
              exit 1
            fi
            sleep 15
          done
          echo "$LIVE_URL is running $COMMIT."
