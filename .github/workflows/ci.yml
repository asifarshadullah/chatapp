name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET 8)
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0.39
        env:
          MONGO_INITDB_ROOT_USERNAME: chatapp
          MONGO_INITDB_ROOT_PASSWORD: chatapp_dev
        # Port 27018 matches the compose file and the hard-coded connection
        # string in MongoDbFixture, so tests need no CI-specific config.
        ports:
          - 27018:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore backend/ChatApp.sln

      - name: Build
        run: dotnet build backend/ChatApp.sln --no-restore --configuration Release

      - name: Test
        run: >-
          dotnet test backend/ChatApp.sln
          --no-build
          --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: artifacts/test-results
          retention-days: 7

  frontend:
    name: Frontend (React 19)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/chat-ui

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/chat-ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
