services:
  mongodb:
    image: mongo:7.0.39
    container_name: chatapp-mongodb
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: chatapp
      MONGO_INITDB_ROOT_PASSWORD: chatapp_dev
      MONGO_INITDB_DATABASE: chatapp
    volumes:
      - mongodb_data:/data/db

  mongo-express:
    image: mongo-express:1.0.2
    container_name: chatapp-mongo-ui
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: chatapp
      ME_CONFIG_MONGODB_ADMINPASSWORD: chatapp_dev
      ME_CONFIG_MONGODB_URL: mongodb://chatapp:chatapp_dev@mongodb:27017/
    depends_on:
      - mongodb

  # The deployed image, run against the local MongoDB and the host's Ollama.
  # Only with `docker compose --profile app up --build`, so the tests' `up -d` stays as it was.
  app:
    profiles: [app]
    build: .
    container_name: chatapp-app
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      MongoDB__ConnectionString: mongodb://chatapp:chatapp_dev@mongodb:27017/?authSource=admin
      MongoDB__DatabaseName: chatapp
      # Local only. A deployed app gets its own secret from the host.
      Jwt__Secret: local-compose-only-secret-never-use-when-deployed-0123456789
      # The image offers only Groq; locally the host's Ollama is added and made the default.
      Ai__DefaultModel: local
      Ai__Models__local__Name: "Local · gemma3:4b"
      Ai__Models__local__BaseUrl: http://host.docker.internal:11434/v1
      Ai__Models__local__Model: gemma3:4b
      Ai__Models__local__ApiKey: ollama
      # Groq is offered too when GROQ_API_KEY is set, as scripts/with-groq.sh does from the Keychain.
      Ai__Models__groq__ApiKey: ${GROQ_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongodb

volumes:
  mongodb_data:
