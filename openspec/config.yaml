schema: intent-driven-chatapp

context: |
  ChatApp — a ChatGPT-style real-time chat application.

  Backend: .NET 8, ASP.NET Core controllers, SignalR server streaming
  (IAsyncEnumerable), MongoDB 7 via Docker Compose, Ollama for local LLM
  inference, Stripe for billing, JWT + Google OAuth for auth.
  Frontend: React 19, TypeScript 5, Vite, MUI.
  Tests: xUnit + FluentAssertions (backend), Vitest + React Testing Library
  (frontend), Playwright (e2e).

  Architecture: three independent bounded contexts — Chat, Identity, Billing —
  each with its own Domain, Application and Infrastructure projects under
  backend/src/, named Chat.*, Chat.Identity.*, Chat.Billing.*. Only Chat.Api
  references all three, as the composition root. Contexts share nothing but
  Guid UserId; no domain type crosses a context boundary. Dependencies point
  inward: Domain has none, Application defines the interfaces it needs, and
  Infrastructure supplies the implementations.

  Conventions: this project is built test-first — see the tdd skill. Commit
  and git conventions live in CLAUDE.md. Architectural reasoning and past
  trade-off decisions live in docs/architecture/.

rules:
  proposal:
    - Before writing this document, invoke the "grilling" skill and run it to an
      empty frontier. Do not write proposal.md until the user confirms shared
      understanding; the answers from the interview are the source material for
      Why, What Changes and Non-goals.
    - State which bounded context the change belongs to, and justify it if the
      answer is not obvious.
    - Include a "Non-goals" section.
  design:
    - Before writing this document, invoke the "c4-diagrams" skill and embed the
      resulting diagrams in design.md. Use Mermaid with plain flowchart or
      sequenceDiagram syntax and lightweight C4-inspired rigor; do not ask the
      user to re-confirm format or rigor. Draw only the levels that answer a
      real question about this change, and state assumptions and open questions
      alongside them.
    - Read every ADR in docs/architecture/decisions/ first and build the
      supersession graph from their Supersedes fields. Only the in-force ADRs
      (accepted, not superseded) constrain this design; superseded ones are
      history, not live commitments. If an in-force ADR needs revisiting, do not
      edit it - raise it under Open Questions for the adr step to supersede.
    - Name the layer each new type belongs to and why, following the inward
      dependency rule.
    - Call out any new interface and say which layer defines it versus
      implements it.
  adr:
    - |
      Do not decide alone which decisions are durable, and do not make the user
      adjudicate a long flat list. After reading the in-force ADRs and
      re-reading design.md, account for every entry in that document's
      Decisions section, split into two groups, and put them to the user in one
      round before writing anything:

        CANDIDATES - these need your call:

        1. <decision title>
           <one line on what was chosen>
           RECOMMEND durable - <what future changes it commits us to>

        ASSESSED TACTICAL - skim and override if I got one wrong:

        2. <title> - <five-word reason it does not qualify>
        3. <title> - <five-word reason it does not qualify>

      A decision belongs in CANDIDATES only if it commits future changes to
      something: a boundary, contract, technology, security property, or an
      accepted trade-off someone might otherwise reverse by accident. Applying
      a rule the project already has is tactical, not durable. Expect one or
      two candidates from a typical change, sometimes none. Never pad the
      candidate list to look thorough, and never drop a decision from the
      tactical list to keep it short - every numbered entry in the Decisions
      section must appear in one group or the other.

      Then stop and wait for the user. Write ADR files and the manifest only
      for what the user promotes, and record in the manifest every decision
      that was considered and declined, so a later reader can see what was
      weighed.
    - |
      If the user promotes nothing, say so plainly in the manifest rather than
      inventing an ADR to justify the step.
  tasks:
    - Every task that changes behaviour starts with a failing test, per the
      tdd skill.
    - Keep tasks small enough to finish and verify in one sitting.

operations:
  apply:
    guidance:
      - "Run the checks CI runs before reporting a task done: npm run
        typecheck, npm run lint and npm run test:run in frontend/chat-ui, and
        dotnet test backend/ChatApp.sln."
      - Playwright e2e is not in CI; run it locally when the chat path changes.
  archive:
    guidance:
      - Confirm the shipped behaviour matches the delta spec before archiving;
        correct the spec if the implementation taught you otherwise.
